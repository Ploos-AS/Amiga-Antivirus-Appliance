name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate research manifests
        run: python3 -m json.tool research/bootblock-sources.json >/dev/null
      - name: Format check
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files"
            exit 1
          fi
      - name: Module metadata check
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/aaa-linux-amd64 ./cmd/aaa
      - name: Build arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/aaa-linux-arm64 ./cmd/aaa
