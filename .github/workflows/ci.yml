name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate research manifests
        run: python3 -m json.tool research/bootblock-sources.json >/dev/null
      - name: Format check
        run: |
          files="$(gofmt -l cmd internal tools)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files"
            exit 1
          fi
      - name: Module metadata check
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check out AmiGuard compatibility baseline
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/AmiGuard
          ref: ebdd5833615adc1e8b327aac4a0cb7e1a8217d3f
          path: _amiguard
          persist-credentials: false
      - name: Validate AAA AmiGuard export with AmiGuard compiler
        run: |
          go run ./tools/amiguard_bridge_fixture > /tmp/aaa-amiguard-research.json
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          compiler_path = Path("_amiguard/tools/compile_signatures.py")
          spec = importlib.util.spec_from_file_location("amiguard_compile_signatures", compiler_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          fixture = Path("/tmp/aaa-amiguard-research.json")
          with fixture.open("r", encoding="utf-8") as handle:
              item = json.load(handle)
          module.validate(str(fixture), item)
          print("AAA AmiGuard research export accepted by pinned AmiGuard compiler.")
          PY
      - name: Build amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/aaa-linux-amd64 ./cmd/aaa
      - name: Build arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/aaa-linux-arm64 ./cmd/aaa
