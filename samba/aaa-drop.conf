[global]
    server min protocol = SMB2_10
    server max protocol = SMB3
    map to guest = Never
    restrict anonymous = 2

[aaa-drop]
    comment = AAA malware scan drop folder
    path = /data/aaa/drop
    browseable = yes
    read only = no
    guest ok = no
    valid users = aaa-drop
    force group = aaa-drop
    create mask = 0660
    force create mode = 0660
    directory mask = 0770
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    smb encrypt = desired
